name: deals-crm

x-app: &app
  build: ./backend
  image: deals-crm-app:local
  environment: &env
    APP_NAME: Deals CRM
    APP_ENV: local
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?Run scripts/init.ps1 or scripts/init.sh}
    APP_URL: http://localhost:${APP_PORT:-8180}
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: deals_crm
    DB_USERNAME: crm
    DB_PASSWORD: ${DB_PASSWORD:?Generate local .env}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    SESSION_DRIVER: array
    WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?Generate local .env}
    MOCK_API_URL: http://mock:8000
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deals_crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate local .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crm -d deals_crm"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    command: [php, artisan, migrate, --force]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: [php, artisan, serve, --host=0.0.0.0, --port=8000, --no-reload]
    ports:
      - "127.0.0.1:${APP_PORT:-8180}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8000/api/deals?page=1') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock:
    <<: *app
    command: [php, artisan, serve, --host=0.0.0.0, --port=8000, --no-reload]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: [php, artisan, queue:work, redis, --sleep=1, --tries=4, --timeout=30]
    depends_on:
      api:
        condition: service_healthy
      mock:
        condition: service_started

  dispatcher:
    <<: *app
    command: [php, artisan, inbox:dispatch, --loop]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
